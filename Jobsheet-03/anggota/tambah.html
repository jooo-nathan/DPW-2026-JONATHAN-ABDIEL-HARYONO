<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Anggota</h2>
            <form>
                <p>
                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_anggota">No. Anggota</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <label for="jenis_kelamin">Jenis Kelamin</label><br>
                    <select id="jenis_kelamin" name="jenis_kelamin">
                        <option value="laki_laki">Laki-laki</option>
                        <option value="perempuan">Perempuan</option>
                    </select>
                </p>
                <p>
                    <label for="jabatan">Jabatan</label><br>
                    <select id="jabatan" name="jabatan">
                        <option value="kepala_perpustakaan">Kepala Perpustakaan</option>
                        <option value="asisten_perpustakaan">Asisten Perpustakaan</option>
                        <option value="pustakawan_ahli_pertama">Pustakawan Ahli Pertama</option>
                        <option value="pustakawan_ahli_muda">Pustakawan Ahli Muda</option>
                        <option value="pustakawan_ahli_madya">Pustakawan Ahli Madya</option>
                        <option value="pustakawan_ahli_utama">Pustakawan Ahli Utama</option>
                        <option value="anggota_perpustakaan">Anggota Perpustakaan</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
